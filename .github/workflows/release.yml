name: Release

on:
  push:
    branches: [main]

# One release run at a time: a second push waits instead of racing a publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Push the tag and the GitHub release. No `pull-requests`: the organization does not let
      # GitHub Actions open pull requests, so the version bump is a pull request a person opens.
      contents: write
      # npm provenance: lets npm verify the package was built by this workflow.
      id-token: write
    env:
      # Secrets cannot appear in `if:` directly; this flag can.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - uses: changesets/action/select-mode@v2
        id: mode

      # Pending changesets mean the version has not been bumped yet: nothing to publish.
      - if: steps.mode.outputs.mode == 'version'
        run:
          echo "::notice::Pending changesets; run 'pnpm changeset version' in a pull
          request to release them."

      # Without an NPM_TOKEN secret the publish step is skipped, so merging to main cannot
      # fail on a missing token or publish by accident before the npm side is set up.
      - if: steps.mode.outputs.mode == 'publish' && env.HAS_NPM_TOKEN == 'true'
        uses: changesets/action/publish@v2
        with:
          script: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node writes the token's `.npmrc` and points `NPM_CONFIG_USERCONFIG` at it,
          # but pnpm 11.0 only reads `PNPM_CONFIG_*`: without this it publishes with no token
          # and npm answers 404.
          PNPM_CONFIG_USERCONFIG: ${{ env.NPM_CONFIG_USERCONFIG }}

      - if: steps.mode.outputs.mode == 'publish' && env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice::NPM_TOKEN is not set; skipping the npm publish."

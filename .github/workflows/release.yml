name: Release

on:
  push:
    branches: [main]

# One release run at a time: a second push waits instead of racing a publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Push the tag and the GitHub release. No `pull-requests`: the organization does not let
      # GitHub Actions open pull requests, so the version bump is a pull request a person opens.
      contents: write
      # npm trusted publishing: the publish authenticates with this workflow's OIDC token,
      # which also signs the provenance statement. There is no npm token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # No `registry-url`: its `.npmrc` sets a placeholder token, and pnpm only falls back
          # to OIDC when no token is configured.
      - run: pnpm install --frozen-lockfile

      - uses: changesets/action/select-mode@v2
        id: mode

      # Pending changesets mean the version has not been bumped yet: nothing to publish.
      - if: steps.mode.outputs.mode == 'version'
        run:
          echo "::notice::Pending changesets; run 'pnpm changeset version' in a pull
          request to release them."

      # Publishes only the versions npm does not have yet, so a push without a version bump
      # publishes nothing. npm accepts it from this repository and workflow (`release.yml`),
      # as set up in the package's trusted publisher.
      - if: steps.mode.outputs.mode == 'publish'
        uses: changesets/action/publish@v2
        with:
          script: pnpm release
